services:
  db:
    image: postgres:16-alpine
    container_name: clinicalvest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicalvest
    ports:
      - "5432:5432"
    volumes:
      - clinicalvest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicalvest"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: clinicalvest-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    # Banco local do Compose (sobrescreve Supabase do .env para o app funcionar offline).
    # Para usar Supabase de novo, remova estas duas linhas e configure o pooler no .env.
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clinicalvest
      DIRECT_URL: postgresql://postgres:postgres@db:5432/clinicalvest
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  clinicalvest_pg:
